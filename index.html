<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Flappy Bird Pixel Pro</title>

<style>
body {
    margin:0;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow:hidden;
    background:linear-gradient(to top, #70c5ce 0%, #a0e0ff 100%);
}

#gameContainer {
    position:relative;
    max-width:400px;
    width:100%;
    height:600px;
    margin:auto;
    top:0; bottom:0; left:0; right:0;
}

canvas {
    border:2px solid #000;
    display:block;
    width:100%;
    height:100%;
    background:linear-gradient(to top, #70c5ce 0%, #a0e0ff 100%);
}

#score {
    position:absolute;
    top:10px;
    left:10px;
    font-size:22px;
    font-weight:bold;
    color:white;
    z-index:10;
}

/* UI MENÚ */
#ui {
    position:absolute;
    width:100%;
    height:100%;
    top:0; left:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,0.5);
    border-radius:15px;
}

.button {
    padding:12px 25px;
    margin:10px;
    font-size:18px;
    cursor:pointer;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#ffcb05,#ff6b6b);
    color:white;
    font-weight:bold;
}

/* Leaderboard */
#leaderboard {
    width:90%;
    max-width:300px;
    margin-top:20px;
    background:white;
    padding:15px;
    border-radius:12px;
    text-align:left;
}

#leaderboard h3 { margin-top:0; text-align:center; }
#leaderboard ol { margin:0; padding-left:20px; }

/* Retry */
#retryContainer {
    display:none;
    position:absolute;
    top:40%;
    left:50%;
    transform:translate(-50%, -50%);
    text-align:center;
    z-index:20;
}

#retry {
    font-size:32px;
    background:#000;
    color:#ffcb05;
    padding:20px 50px;
    border-radius:12px;
    cursor:pointer;
    margin-bottom:15px;
}

#menuBtn {
    font-size:18px;
    padding:12px 30px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:linear-gradient(135deg,#6b5bff,#00e0ff);
    color:white;
    font-weight:bold;
}

/* Mensaje de "toca para saltar" */
#tapMessage {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:rgba(0,0,0,0.6);
    color:white;
    padding:15px 20px;
    border-radius:10px;
    font-size:20px;
    display:none;
    z-index:15;
}
</style>
</head>

<body>

<div id="gameContainer">

    <canvas id="gameCanvas" width="400" height="600"></canvas>

    <div id="score">Puntos: 0 - Nivel: 1</div>

    <div id="tapMessage">Toca la pantalla o presiona ESPACIO para saltar</div>

    <div id="ui">
        <h1 style="color:#ffcb05;">Flappy Bird Pixel Pro</h1>

        <label style="color:white; font-size:18px;">
            Nombre:
            <input type="text" id="playerName" placeholder="Jugador"
                style="padding:5px 10px; font-size:16px; border-radius:5px;">
        </label>

        <button class="button" id="startGame">Comenzar</button>

        <div id="leaderboard">
            <h3>Tabla de posiciones</h3>
            <ol id="leaderboardList"></ol>
        </div>
    </div>

    <div id="retryContainer">
        <div id="retry">Intentar de nuevo</div>
        <button id="menuBtn">Volver al menú</button>
    </div>
</div>

<script>

// Fix de audio para Android
document.addEventListener("touchstart", () => {
    try { jumpSound.play(); jumpSound.pause(); } catch(e){}
}, {once:true});

// ===== VARIABLES =====
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const ui = document.getElementById("ui");
const scoreDiv = document.getElementById("score");
const startBtn = document.getElementById("startGame");
const playerInput = document.getElementById("playerName");
const leaderboardList = document.getElementById("leaderboardList");
const retryContainer = document.getElementById("retryContainer");
const retryBtn = document.getElementById("retry");
const menuBtn = document.getElementById("menuBtn");
const tapMessage = document.getElementById("tapMessage");

let birdImg = new Image();
birdImg.src = "assets/bird.png";

let jumpSound = new Audio("assets/jump.mp3");
let coinSound = new Audio("assets/coin.mp3");

let bird = {x:50, y:300, width:32, height:32, velocity:0};
let gravity=0.5, jump=-10, pipes=[], coins=[], clouds=[], frame=0;
let score=0, level=1, pipeSpeed=2, gameRunning=false;
let leaderboard = JSON.parse(localStorage.getItem('flappyLeaderboard')) || [];


// Nubes
for(let i=0;i<5;i++){
    clouds.push({x:Math.random()*400, y:Math.random()*150+50, r:20+Math.random()*30, s:0.3});
}

function updateLeaderboard(){
    leaderboard.sort((a,b)=>b.score-a.score);
    leaderboardList.innerHTML="";
    leaderboard.slice(0,5).forEach(item=>{
        const li=document.createElement("li");
        li.textContent=`${item.name}: ${item.score}`;
        leaderboardList.appendChild(li);
    });
}

function startGame(){
    if(playerInput.value.trim()==="") playerInput.value="Jugador";
    ui.style.display="none";
    retryContainer.style.display="none";

    score=0; level=1; pipeSpeed=2; frame=0;
    bird.y=300; bird.velocity=0;
    pipes=[]; coins=[];

    scoreDiv.innerText=`Puntos: ${score} - Nivel: ${level}`;

    // mostrar mensaje "toca para saltar"
    tapMessage.style.display="block";

    gameRunning=true;
}

startBtn.addEventListener("click", startGame);
retryBtn.addEventListener("click", startGame);

menuBtn.addEventListener("click", ()=>{
    ui.style.display="flex";
    retryContainer.style.display="none";
});

// Saltar
function doJump(){
    if(!gameRunning) return;
    bird.velocity=jump;
    jumpSound.play();
    tapMessage.style.display="none"; // desaparecer mensaje al primer salto
}

document.addEventListener("keydown", e=>{
    if(e.code==="Space") doJump();
});
document.addEventListener("touchstart", doJump);

// Tubos + monedas
function createPipe(){
    let h=Math.floor(Math.random()*200)+100;
    pipes.push({x:400,y:0,w:50,h:h,scored:false});
    pipes.push({x:400,y:h+150,w:50,h:600-(h+150),scored:false});
    coins.push({x:425,y:h+75,r:10,col:false,type:"normal"});
}

function draw(){
    ctx.clearRect(0,0,400,600);

    // nubes
    clouds.forEach(c=>{
        ctx.fillStyle="white";
        ctx.beginPath();
        ctx.arc(c.x,c.y,c.r,0,Math.PI*2);
        ctx.fill();
    });

    // tubos
    ctx.fillStyle="#34a853";
    pipes.forEach(p=>{
        ctx.fillRect(p.x,p.y,p.w,p.h);
    });

    // monedas
    coins.forEach(c=>{
        if(!c.col){
            ctx.fillStyle = c.type==="normal" ? "#ffdd00" : "#aa00ff";
            ctx.beginPath();
            ctx.arc(c.x,c.y,c.r,0,Math.PI*2);
            ctx.fill();
        }
    });

    // pájaro
    ctx.drawImage(birdImg, bird.x, bird.y, bird.width, bird.height);
}

function update(){
    if(!gameRunning) return;

    clouds.forEach(c=>{ c.x-=c.s; if(c.x<-30)c.x=430; });

    bird.velocity+=gravity;
    bird.y+=bird.velocity;

    if(bird.y<0 || bird.y+bird.height>600) endGame();

    if(frame%90===0) createPipe();

    pipes.forEach(p=>{
        p.x-=pipeSpeed;

        // colisión
        if(bird.x<p.x+p.w && bird.x+bird.width>p.x && bird.y<p.y+p.h && bird.y+bird.height>p.y){
            endGame();
        }

        // sumar puntos
        if(!p.scored && p.x+p.w<bird.x && p.y===0){
            score++; p.scored=true;
        }
    });

    // monedas
    coins.forEach(c=>{
        c.x-=pipeSpeed;
        let dx=bird.x+bird.width/2-c.x;
        let dy=bird.y+bird.height/2-c.y;
        if(Math.sqrt(dx*dx+dy*dy) < c.r + bird.width/2){
            score+=1;
            c.col=true;
            coinSound.play();
        }
    });

    if(score>=level*20){
        level++;
        pipeSpeed+=0.5;
    }

    scoreDiv.innerText=`Puntos: ${score} - Nivel: ${level}`;
    frame++;
}

function endGame(){
    gameRunning=false;
    tapMessage.style.display="none";

    leaderboard.push({name:playerInput.value, score});
    localStorage.setItem("flappyLeaderboard", JSON.stringify(leaderboard));
    updateLeaderboard();

    retryContainer.style.display="block";
}

function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();
updateLeaderboard();

</script>

</body>
</html>
