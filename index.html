<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Cadetes — Medidor PRO</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#071022; --panel:#071827; --glass: rgba(255,255,255,0.03);
  --accent:#06b6d4; --accent-2:#0ea5a7; --muted:#94a3b8; --card-radius:14px;
  --safe-area: env(safe-area-inset-bottom);
  --topbar-h:64px;
}
html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:#e6eef6;background:linear-gradient(180deg,#041624,#071022);}
#app{height:100%;display:flex;flex-direction:column}

/* Splash */
#splash{position:absolute;inset:0;background:linear-gradient(180deg,#072033,#05202b);display:flex;align-items:center;justify-content:center;z-index:2000;flex-direction:column;color:#06b6d4;font-size:1.8rem;font-weight:700;}
@keyframes pulse {0%,100%{opacity:1;}50%{opacity:0.3;}}

/* Top bar */
header{position:fixed;left:0;right:0;top:0;height:var(--topbar-h);display:flex;align-items:center;justify-content:space-between;padding:10px 14px;z-index:1400;background:linear-gradient(180deg,#007aff,#0066d6);border-bottom:1px solid rgba(255,255,255,0.04);backdrop-filter:blur(8px);}
header .title{font-weight:700;font-size:1rem} header .small{font-size:0.85rem;color:var(--muted)}

/* Map */
#map{flex:1;position:relative;margin-top:var(--topbar-h);z-index:0}

/* Overlays */
.overlay{position:absolute;left:12px;right:12px;z-index:1200;}
.controls{top:12px;display:flex;flex-direction:column;gap:10px}
.bottom{bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.card{background:rgba(0,122,255,0.16);backdrop-filter: blur(10px);padding:10px;border-radius:var(--card-radius);box-shadow:0 8px 30px rgba(2,6,23,0.6);border:1px solid rgba(255,255,255,0.06);color:#e6eef6}
.row{display:flex;gap:8px;align-items:center}
input,select,button{font-size:15px}
input,select{padding:10px;border-radius:10px;border:none;background:rgba(0,0,0,0.18);color:inherit;outline:1px solid rgba(255,255,255,0.03)}
button{padding:10px 12px;border-radius:10px;border:none;background:linear-gradient(90deg,var(--accent-2),var(--accent));color:#022;font-weight:700}
.ghost{background:transparent;color:var(--accent);border:1px solid rgba(255,255,255,0.04);}
.muted{color:var(--muted);font-size:13px}
.status{min-width:160px;text-align:right}
.big{font-size:1.05rem;font-weight:700}

/* Menu screen */
.menuScreen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:1300}
.menuInner{width:94%;max-width:520px;padding:20px;border-radius:16px;background:linear-gradient(180deg,#072033,#05202b);box-shadow:0 12px 40px rgba(2,6,23,0.6);}
.title{font-size:1.35rem;margin-bottom:6px}
.subtitle{color:var(--muted);font-size:0.95rem;margin-bottom:14px}
.menuButtons{display:flex;flex-direction:column;gap:10px}

/* Historial */
#historyScreen{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:1500;overflow:auto;padding:12px}
#historyScreen .menuInner{width:100%;max-width:540px;background:var(--panel);padding:16px;border-radius:16px;box-shadow:0 8px 30px rgba(2,6,23,0.6);}
.tripItem{background:rgba(255,255,255,0.05);margin-bottom:10px;padding:10px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px;}
.tripItem .info{flex:1}

/* Responsive */
@media (min-width:720px){ .controls{left:20px;top:20px;width:360px} .bottom{left:20px;right:20px} }
@media (max-width:420px){ input{font-size:14px} button{font-size:14px} .title{font-size:1.15rem} }
</style>
</head>
<body>
<div id="app">

<!-- Splash -->
<div id="splash">CADESYS PRO<span style="display:block;margin-top:10px;font-size:0.9rem;animation:pulse 1s infinite;">Cargando...</span></div>

<!-- Top bar -->
<header>
  <div style="display:flex;flex-direction:column">
    <div class="title">Cadetes — Medidor PRO</div>
    <div class="small">Medí distancia y cobro en tiempo real</div>
  </div>
  <div style="text-align:right">
    <div class="small">Tiempo</div>
    <div id="timer" class="big">00:00:00</div>
  </div>
</header>

<div id="map"></div>

<!-- Controls -->
<div class="overlay controls" style="left:12px;top:calc(var(--topbar-h) + 12px);width:calc(100% - 48px);max-width:420px;">
  <div class="card row" style="flex-direction:column;gap:8px">
    <div style="width:100%;display:flex;gap:8px">
      <input id="address" placeholder="Destino: calle, nro o ciudad" style="flex:1" />
      <button id="searchBtn">Buscar</button>
    </div>
    <div style="display:flex;gap:8px;align-items:center;justify-content:space-between;width:100%">
      <div class="muted">Tarifa base: $<span id="baseFare">50</span></div>
      <div class="muted">Tarifa/km: $<span id="perKm">20</span></div>
    </div>
  </div>
</div>

<div class="overlay bottom" style="right:12px;left:auto;bottom:12px;">
  <div class="card row" style="gap:10px">
    <div style="min-width:140px;text-align:center">
      <div class="muted">Distancia</div>
      <div class="big"><span id="distance">0.000</span> km</div>
    </div>
    <div style="min-width:160px;text-align:right">
      <div class="muted">Cobro</div>
      <div class="big">$<span id="fare">0.00</span></div>
    </div>
  </div>
</div>

<div class="overlay" style="left:12px;bottom:calc(12px + var(--safe-area));">
  <div class="card row" style="gap:8px">
    <button id="startBtn" class="btn">Iniciar viaje</button>
    <button id="pauseBtn" class="ghost">Pausar</button>
    <button id="finishBtn" class="ghost">Finalizar</button>
    <button id="menuBtn" class="ghost">Menú</button>
  </div>
</div>

<!-- Menu Screen -->
<div id="menuScreen" class="menuScreen" style="display:none;">
  <div class="menuInner">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div>
        <div class="title">Cadetes — Medidor PRO</div>
        <div class="subtitle">Medí distancia y cobro en tiempo real. Funciona en celular y escritorio.</div>
      </div>
      <div style="text-align:right;color:var(--muted)">v1.2</div>
    </div>
    <div class="menuButtons" style="margin-top:14px">
      <button id="btnNewTrip">Nuevo viaje</button>
      <button id="btnHistory" class="ghost">Historial</button>
    </div>
  </div>
</div>

<!-- History Screen -->
<div id="historyScreen">
  <div class="menuInner">
    <h3>Historial de viajes</h3>
    <div id="tripList"></div>
    <button id="exportPDF" class="btn">Exportar a PDF</button>
    <button id="closeHistory" class="ghost" style="margin-top:8px;">Cerrar</button>
  </div>
</div>

</div>
<script>
const tarifaBase=50, tarifaPorKm=20;
document.getElementById('baseFare').textContent=tarifaBase;
document.getElementById('perKm').textContent=tarifaPorKm;

let map=L.map('map').setView([-31.4201,-64.1888],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OSM'}).addTo(map);

let userMarker=null,accuracyCircle=null;
let pathLine=L.polyline([], {weight:4,opacity:0.9,color:'#06b6d4'}).addTo(map);
let lastPos=null,totalDistanceMeters=0;
let timerInterval=null,elapsedMs=0,timerRunning=false,tripStartISO=null;
const CURRENT_TRIP_KEY='cadetes_current_trip_pro',HISTORY_KEY='cadetes_trip_history_pro';
const ACC_LIMIT=60; // Precisión

window.addEventListener('load',()=>{setTimeout(()=>{document.getElementById('splash').style.display='none';},1000);});

function formatTime(ms){ const t=Math.floor(ms/1000); const hh=Math.floor(t/3600).toString().padStart(2,'0'); const mm=Math.floor((t%3600)/60).toString().padStart(2,'0'); const ss=(t%60).toString().padStart(2,'0'); return `${hh}:${mm}:${ss}`; }
function haversine(a,b){const toRad=x=>x*Math.PI/180;const R=6371000;const dLat=toRad(b[0]-a[0]);const dLon=toRad(b[1]-a[1]);const lat1=toRad(a[0]),lat2=toRad(b[0]);const sLat=Math.sin(dLat/2),sLon=Math.sin(dLon/2);return 2*R*Math.asin(Math.sqrt(sLat*sLat+Math.cos(lat1)*Math.cos(lat2)*sLon*sLon));}

function startTimer(){if(timerRunning)return;timerRunning=true;tripStartISO=tripStartISO||new Date().toISOString(); const start=Date.now()-elapsedMs; timerInterval=setInterval(()=>{elapsedMs=Date.now()-start; document.getElementById('timer').textContent=formatTime(elapsedMs); saveCurrentTrip();},250);}
function pauseTimer(){timerRunning=false;if(timerInterval)clearInterval(timerInterval);timerInterval=null;saveCurrentTrip();}
function stopTimer(){pauseTimer();elapsedMs=0;timerRunning=false;tripStartISO=null;document.getElementById('timer').textContent='00:00:00';saveCurrentTrip();}
function saveCurrentTrip(){if(!timerRunning && elapsedMs===0){localStorage.removeItem(CURRENT_TRIP_KEY);return;} const state={started_at:tripStartISO,elapsedMs,totalDistanceMeters,path:pathLine.getLatLngs().map(p=>[p.lat,p.lng])}; localStorage.setItem(CURRENT_TRIP_KEY,JSON.stringify(state));}
function restoreCurrentTrip(){const raw=localStorage.getItem(CURRENT_TRIP_KEY);if(!raw)return; try{const s=JSON.parse(raw);tripStartISO=s.started_at;elapsedMs=s.elapsedMs||0;totalDistanceMeters=s.totalDistanceMeters||0;const coords=s.path||[];if(coords.length){pathLine.setLatLngs(coords.map(c=>[c[0],c[1]]));lastPos={coords:{latitude:coords[coords.length-1][0],longitude:coords[coords.length-1][1],accuracy:10}};}document.getElementById('timer').textContent=formatTime(elapsedMs);document.getElementById('distance').textContent=(totalDistanceMeters/1000).toFixed(3);document.getElementById('fare').textContent=(tarifaBase+(totalDistanceMeters/1000)*tarifaPorKm).toFixed(2);if(timerRunning){startTimer();}}catch(e){console.error(e);} 

function updateUI(pos){const acc=pos&&pos.coords?Math.round(pos.coords.accuracy):'—';document.getElementById('distance').textContent=(totalDistanceMeters/1000).toFixed(3);document.getElementById('fare').textContent=(tarifaBase+(totalDistanceMeters/1000)*tarifaPorKm).toFixed(2); if(pos&&pos.coords){const latlng=[pos.coords.latitude,pos.coords.longitude];if(!userMarker){userMarker=L.circleMarker(latlng,{radius:8,color:'#06b6d4',fillColor:'#06b6d4',fillOpacity:1}).addTo(map);map.setView(latlng,15);}else userMarker.setLatLng(latlng);if(!accuracyCircle)accuracyCircle=L.circle(latlng,{radius:pos.coords.accuracy,color:'rgba(6,182,212,0.15)',fillColor:'rgba(6,182,212,0.08)'}).addTo(map);else{accuracyCircle.setLatLng(latlng);accuracyCircle.setRadius(pos.coords.accuracy);}if(timerRunning){let color='#06b6d4';if(pos.coords.accuracy>ACC_LIMIT*2)color='red';else if(pos.coords.accuracy>ACC_LIMIT)color='yellow';pathLine.addLatLng(latlng);pathLine.setStyle({color}); if(pos.coords.accuracy>ACC_LIMIT && navigator.vibrate){navigator.vibrate(300);}}} saveCurrentTrip();}

// ---------- Geolocation ----------
let watchingId=null,lastSamples=[];
function processPosition(pos){if(!pos||!pos.coords)return; lastSamples.push(pos); if(lastSamples.length>6)lastSamples.shift(); let sw=0,swLat=0,swLon=0;for(const s of lastSamples){const w=1/Math.max(1,s.coords.accuracy);sw+=w;swLat+=s.coords.latitude*w;swLon+=s.coords.longitude*w;} const avg={coords:{latitude:swLat/sw,longitude:swLon/sw,accuracy:lastSamples[lastSamples.length-1].coords.accuracy}}; if(timerRunning&&lastPos){const d=haversine([lastPos.coords.latitude,lastPos.coords.longitude],[avg.coords.latitude,avg.coords.longitude]);if(d>0.5)totalDistanceMeters+=d;} lastPos=avg; updateUI(avg);}
function startWatching(){if(!navigator.geolocation){alert('Tu navegador no soporta geolocalización');return;} watchingId=navigator.geolocation.watchPosition(processPosition,(e)=>{console.error(e);}, {enableHighAccuracy:true,maximumAge:5000,timeout:10000});}
function stopWatching(){if(watchingId){navigator.geolocation.clearWatch(watchingId);watchingId=null;}}

// ---------- Trip control ----------
let isRunning=false;
document.getElementById('startBtn').addEventListener('click',()=>{if(!isRunning){isRunning=true;startTimer();startWatching();}else alert('Viaje ya iniciado');});
document.getElementById('pauseBtn').addEventListener('click',()=>{if(isRunning){isRunning=false;pauseTimer();stopWatching();}});
document.getElementById('finishBtn').addEventListener('click',()=>{
  if(confirm('Finalizar viaje y guardar registro?')){
    isRunning=false; pauseTimer(); stopWatching();
    const trip={started_at:tripStartISO,elapsedMs,totalDistanceMeters,path:pathLine.getLatLngs().map(p=>[p.lat,p.lng]),fare:(tarifaBase+(totalDistanceMeters/1000)*tarifaPorKm).toFixed(2)};
    saveTripToHistory(trip);
    alert('Viaje guardado en historial local');
    pathLine.setLatLngs([]); totalDistanceMeters=0; elapsedMs=0; lastPos=null; lastSamples=[]; updateUI(null);
    localStorage.removeItem(CURRENT_TRIP_KEY);
  }
});

// ---------- Menu ----------
document.getElementById('menuBtn').addEventListener('click',()=>{document.getElementById('menuScreen').style.display='flex';});
document.getElementById('btnNewTrip').addEventListener('click',()=>{document.getElementById('menuScreen').style.display='none';});
document.getElementById('btnHistory').
document.getElementById('btnHistory').addEventListener('click',()=>{
    document.getElementById('menuScreen').style.display='none';
    showHistory();
});

// ---------- Historial ----------
function saveTripToHistory(trip){
    let history = JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');
    history.push(trip);
    localStorage.setItem(HISTORY_KEY,JSON.stringify(history));
}

function showHistory(){
    const historyScreen = document.getElementById('historyScreen');
    const tripList = document.getElementById('tripList');
    tripList.innerHTML = '';
    let history = JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');
    if(history.length===0){tripList.innerHTML='<p class="muted">No hay viajes registrados</p>';}
    else{
        history.slice().reverse().forEach((trip,i)=>{
            const item = document.createElement('div');
            item.className='tripItem';
            const date = new Date(trip.started_at).toLocaleString();
            item.innerHTML=`<div class="info"><b>Viaje ${history.length-i}</b><br>${date}<br>Distancia: ${(trip.totalDistanceMeters/1000).toFixed(3)} km<br>Tarifa: $${trip.fare}</div>`;
            tripList.appendChild(item);
        });
    }
    historyScreen.style.display='flex';
}

document.getElementById('closeHistory').addEventListener('click',()=>{
    document.getElementById('historyScreen').style.display='none';
});

// ---------- Exportar PDF ----------
document.getElementById('exportPDF').addEventListener('click',()=>{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    let history = JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');
    if(history.length===0){alert('No hay viajes para exportar'); return;}
    doc.setFontSize(14); doc.text('Historial de viajes Cadetes PRO',14,14);
    history.slice().reverse().forEach((trip,i)=>{
        const y = 20 + i*25;
        const date = new Date(trip.started_at).toLocaleString();
        doc.setFontSize(12);
        doc.text(`Viaje ${history.length-i}: ${date}`,14,y);
        doc.text(`Distancia: ${(trip.totalDistanceMeters/1000).toFixed(3)} km`,14,y+6);
        doc.text(`Tarifa: $${trip.fare}`,14,y+12);
    });
    doc.save('historial_viajes.pdf');
});

// ---------- Inicialización ----------
restoreCurrentTrip();
</script>
</body>
</html>
