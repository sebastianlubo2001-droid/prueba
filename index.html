<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repartos Thompson - Cotizador</title>
    
    <!-- Carga de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS (Mapas) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>

    <!-- Configuración de Tailwind -->
    <script>
        tailwind.config = {
            darkMode: 'class', // Habilitar modo oscuro basado en la clase 'dark' en el <html>
            theme: {
                extend: {
                    colors: {
                        'primary-dark': '#0D9488',  // Teal 700 (Principal)
                        'primary-light': '#14B8A6', // Teal 500 (Hover/Acento)
                        'accent-success': '#4ade80', // Green 400
                        'accent-error': '#ef4444',
                        'accent-warning': '#f59e0b', // Amber 500
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        /* Estilos base del cuerpo */
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
            transition: background-color 0.3s;
        }

        /* --- COLORES PARA EL MODO CLARO (DEFAULT) --- */
        body { background-color: #f3f4f6; } /* gray-100 */
        .app-card { background-color: #ffffff; } /* white */
        .card-shadow { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); }
        .input-field { 
            background-color: #f9fafb; /* gray-50 */
            border: 1px solid #e5e7eb; /* gray-200 */
            color: #1f2937; /* gray-800 */
        }
        .suggestion-dropdown {
            background-color: white;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            border: 1px solid #e5e7eb;
        }

        /* --- COLORES PARA EL MODO OSCURO (CLASE dark) --- */
        .dark body { background-color: #1f2937; } /* gray-800 */
        .dark .app-card { 
            background-color: #374151; /* gray-700 */
            color: #f3f4f6; /* gray-100 */
        }
        .dark .card-shadow { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -2px rgba(0, 0, 0, 0.2); }
        .dark .input-field { 
            background-color: #4b5563; /* gray-600 */
            border: 1px solid #4b5563;
            color: #f3f4f6; 
        }
        .dark .input-field::placeholder { color: #9ca3af; } /* gray-400 */
        .dark .suggestion-dropdown {
            background-color: #4b5563;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
            border: 1px solid #4b5563;
        }

        /* Estilos de input (generales) */
        .input-field {
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            transition: all 0.2s ease-in-out;
            width: 100%; 
        }
        .input-field:focus {
            outline: none;
            border-color: theme('colors.primary-light');
            box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.2); 
        }
        .dark .input-field:focus {
            box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.4); 
        }

        /* Botones y acentos */
        .btn-primary {
            font-weight: 700;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.06);
            transition: all 0.2s ease-in-out;
            background-color: theme('colors.primary-dark');
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            background-color: theme('colors.primary-light');
            transform: translateY(-1px);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-secondary {
            background-color: #e5e7eb; 
            color: #4b5563; 
            font-weight: 600;
            padding: 0.5rem 1rem;
            border-radius: 0.75rem;
            transition: all 0.2s ease-in-out;
        }
        .dark .btn-secondary {
            background-color: #4b5563; 
            color: #f3f4f6; 
        }
        .btn-secondary:hover {
             background-color: #d1d5db; 
        }
        .dark .btn-secondary:hover {
             background-color: #6b7280; 
        }
        
        /* Botones de Edición (Rojo) */
        .btn-edit-active {
            animation: pulse-red 1.5s infinite;
            background-color: theme('colors.accent-error');
            color: white;
            box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
        }
        .btn-edit-active:hover {
            background-color: #dc2626; /* red-600 */
        }
        @keyframes pulse-red {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* Mapa */
        #map {
            width: 100%;
            height: 100%;
            border-radius: 0.75rem;
            z-index: 1; 
        }
        
        /* Mensaje de modo edición y Pin */
        #edit-mode-message, #pin-mode-message {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            padding: 8px 16px;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 0.875rem;
            background-color: theme('colors.accent-error');
            color: white;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        .edit-active #edit-mode-message, .pin-active #pin-mode-message {
            opacity: 1;
        }
        
        /* Crosshair para el modo Pin de Destino */
        .pin-active #map {
            cursor: crosshair;
        }

        .pin-active .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid #ef4444; /* Rojo */
            pointer-events: none; /* Asegura que el clic pase al mapa */
            box-shadow: 0 0 0 10px rgba(239, 68, 68, 0.2); 
            z-index: 9999;
            animation: breathe 1.5s infinite;
        }
        
        @keyframes breathe {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.7; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }


        /* Dropdown de Sugerencias */
        .suggestion-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            z-index: 9999; 
            margin-top: 4px;
            border-radius: 0.75rem;
            max-height: 200px;
            overflow-y: auto;
            transition: background-color 0.3s;
        }

        /* Ítem individual en el dropdown */
        .suggestion-item {
            display: flex;
            align-items: center;
            padding: 0.75rem;
            cursor: pointer;
            border-bottom: 1px solid #f3f4f6; /* gray-100 */
            transition: background-color 0.1s, color 0.1s;
        }
        .dark .suggestion-item {
             border-bottom: 1px solid #374151; /* gray-700 */
        }

        .suggestion-item:hover {
            background-color: theme('colors.primary-light');
            color: white;
        }
        .suggestion-item:hover span, .suggestion-item:hover svg {
            color: white !important;
        }
        
        /* Estilos para impresión/PDF */
        @media print {
            body > :not(.print-container) {
                display: none;
            }
            .print-container {
                display: block !important;
                width: 100%;
                margin: 0;
                padding: 20px;
                box-shadow: none;
            }
            .print-table th, .print-table td {
                border: 1px solid #ccc;
            }
            .print-table th {
                background-color: #f0f0f0;
            }
        }
    </style>
</head>
<body class="flex flex-col items-center">

    <!-- Contenedor Principal de la App -->
    <div class="w-full max-w-xl p-8 app-card card-shadow rounded-3xl border-t-8 border-primary-dark mb-6 relative">
        
        <!-- Botón de Alternar Tema -->
        <button id="theme-toggle" onclick="toggleTheme()" class="absolute top-4 right-4 p-2 rounded-full text-xl transition-colors duration-300 text-gray-700 hover:bg-gray-200 dark:text-gray-100 dark:hover:bg-gray-600">
            <!-- Icono inicial se establece en JS -->
        </button>

        <!-- Logo/Título -->
        <h1 class="text-3xl font-extrabold text-center text-primary-dark mb-2 pt-4 flex items-center justify-center">
            <svg class="w-8 h-8 mr-2 text-primary-dark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line>
            </svg>
            Repartos Thompson
        </h1>
        <p class="text-sm text-gray-500 text-center mb-6 dark:text-gray-400">
            Cotizador de envíos en Paraná, Entre Ríos.
        </p>

        <!-- Información de Autenticación -->
        <div class="p-2 rounded-lg text-xs mb-4 overflow-hidden bg-gray-100 text-gray-500 dark:bg-gray-600 dark:text-gray-400">
             <span class="font-bold">ID de Sesión:</span> <span id="user-id-display">Cargando...</span>
        </div>

        <!-- Contenedor del Mapa -->
        <div class="h-64 w-full bg-gray-200 dark:bg-gray-600 rounded-xl overflow-hidden shadow-inner mb-6 relative">
            <div id="edit-mode-message">📍 MODO EDICIÓN DE ORIGEN ACTIVO 📍</div>
            <div id="pin-mode-message">🎯 MODO PIN DE DESTINO ACTIVO 🎯</div>
            <!-- Crosshair para el modo Pin -->
            <div id="crosshair" class="crosshair hidden"></div>
            <div id="map"></div>
        </div>

        <!-- Configuración de Tarifa -->
        <div class="bg-primary-dark/5 p-4 rounded-xl mb-6 border border-primary-dark/20 dark:bg-primary-dark/10 dark:border-primary-dark/40">
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-sm font-bold uppercase tracking-wide text-primary-dark">Tarifas</h2>
                <button onclick="toggleSettings()" class="text-xs underline hover:text-primary-light text-primary-dark">Mostrar/Ocultar</button>
            </div>
            <div id="settings-panel" class="hidden flex-col sm:flex-row gap-3">
                <div class="flex flex-col w-full">
                    <label for="tarifa-base" class="text-xs font-semibold mb-1 text-gray-600 dark:text-gray-300">Base ($):</label>
                    <input type="number" id="tarifa-base" value="500" class="input-field py-1 text-sm" min="0">
                </div>
                <div class="flex flex-col w-full">
                    <label for="costo-km" class="text-xs font-semibold mb-1 text-gray-600 dark:text-gray-300">Costo/km ($):</label>
                    <input type="number" id="costo-km" value="300" class="input-field py-1 text-sm" min="0">
                </div>
            </div>
        </div>

        <!-- Origen Fijo / Editable -->
        <div class="mb-4">
            <label class="text-xs font-bold uppercase ml-1 text-gray-400">Punto de Origen</label>
            <div id="origin-info" class="flex flex-col sm:flex-row items-start sm:items-center space-y-2 sm:space-y-0 sm:space-x-3 p-3 rounded-xl mt-1 bg-gray-100 border border-gray-200 dark:bg-gray-600 dark:border-gray-500">
                <div class="flex items-center space-x-2 flex-grow">
                    <svg class="w-5 h-5 text-primary-dark flex-shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2L12 10"></path><path d="M16 6L8 6"></path><path d="M16 10H8c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2v-8c0-1.1-.9-2-2-2z"></path>
                    </svg>
                    <span id="origin-name-display" class="font-semibold text-sm text-gray-700 dark:text-gray-200">Farmacia Thompson (Av. Francisco Ramírez 1328)</span>
                </div>
                <!-- Botón de Edición del Origen -->
                <button id="edit-origin-btn" onclick="toggleEditMode()" class="btn-secondary flex-shrink-0 text-xs px-2 py-1 flex items-center">
                    <svg class="w-3 h-3 mr-1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
                    </svg>
                    Editar
                </button>
            </div>
        </div>
        
        <!-- Input de Destino con Buscador Real (Nominatim) -->
        <div class="mb-6 relative">
            <label class="text-xs font-bold uppercase ml-1 text-gray-400">Destino en Paraná</label>
            <div id="destino-input-wrapper" class="flex items-center space-x-3 input-field mt-1 relative z-20">
                <svg class="w-5 h-5 text-accent-error flex-shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle>
                </svg>
                <input type="text" id="destino" placeholder="Escribe calle y altura (Ej: Ezpeleta 1200)"
                       class="w-full bg-transparent focus:outline-none placeholder-gray-400 text-sm" autocomplete="off">
                
                <!-- Spinner de carga pequeño dentro del input -->
                <div id="search-spinner" class="hidden">
                    <svg class="animate-spin h-4 w-4 text-primary-dark" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </div>

                <!-- Nuevo Botón de Pin para Destino -->
                <button id="pin-destination-btn" onclick="togglePinMode()" class="btn-secondary flex-shrink-0 text-xs px-2 py-1 flex items-center">
                    <svg class="w-3 h-3" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 21.5L12 12M12 12L12 2.5M12 12H21.5M12 12H2.5"></path>
                    </svg>
                </button>
            </div>
            <!-- Dropdown de Sugerencias -->
            <div id="suggestions-destino" class="suggestion-dropdown hidden"></div>
        </div>

        <!-- Control de Tipo de Pago (POSNET desglosado) -->
        <div class="mb-6">
            <label for="tipo-pedido" class="text-xs font-bold uppercase ml-1 text-gray-400">Tipo de Pago</label>
            <select id="tipo-pedido" class="input-field w-full mt-1 text-sm appearance-none">
                <option value="Al Contado">Al Contado (Efectivo)</option>
                <option value="POSNET - Débito">POSNET - Débito</option>
                <option value="POSNET - Crédito">POSNET - Crédito</option>
            </select>
        </div>

        <!-- Resultados y Botón de Guardar -->
        <div id="results-area" class="opacity-50 pointer-events-none transition-opacity duration-300">
            <div class="p-4 rounded-xl border-l-4 border-primary-dark bg-primary-dark/5 dark:bg-primary-dark/10">
                <div class="flex justify-between items-end mb-2">
                    <span class="text-sm font-medium text-gray-600 dark:text-gray-300">Distancia Real:</span>
                    <span id="distance-result" class="text-lg font-bold text-primary-dark">0.0 km</span>
                </div>
                <div class="h-px my-2 bg-gray-300 dark:bg-gray-600"></div>
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end">
                    <span class="text-lg font-extrabold mb-1 sm:mb-0 text-gray-800 dark:text-gray-100">TOTAL:</span>
                    <span id="total-cost" class="text-3xl font-extrabold text-primary-dark">$0</span>
                </div>
            </div>
            <!-- Botón de Guardar movido debajo del Total -->
            <div class="mt-4 text-center">
                <button id="save-trip-btn" class="btn-primary w-full disabled:opacity-50" onclick="saveTrip()" disabled>
                    Guardar Viaje
                </button>
            </div>
        </div>

        <!-- Mensajes -->
        <div id="message-area" class="mt-4 h-5 text-xs text-center font-medium"></div>
    </div>

    <!-- Sección de Historial de Viajes -->
    <div class="w-full max-w-xl p-8 app-card card-shadow rounded-3xl mb-10">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold text-gray-700 dark:text-gray-100">Historial de Cotizaciones (<span id="trip-count">0</span>)</h2>
            <button id="print-history-btn" class="btn-secondary flex items-center text-sm disabled:opacity-50" disabled onclick="printHistory()">
                <svg class="w-4 h-4 mr-1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect>
                </svg>
                Imprimir / PDF

        <div id="trip-history-container" class="space-y-3">
            <p id="history-loading" class="text-center text-gray-500 dark:text-gray-400 text-sm">Cargando historial...</p>
        </div>
    </div>
    
    <!-- Contenedor solo para la vista de impresión/PDF -->
    <div id="print-view" class="print-container hidden"></div>


    <!-- Script de Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
     
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, addDoc, onSnapshot, collection, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Configuración Global ---
        // Coordenadas iniciales de la Farmacia Thompson (Av. Francisco Ramírez 1328)
        let ORIGIN_COORDS = [-31.7588, -60.5186]; 
        let ORIGIN_NAME = "Farmacia Thompson, Av. Francisco Ramírez 1328, E3100 Paraná, Entre Ríos"; 
        let SHORT_ORIGIN_NAME = "Av. Francisco Ramírez 1328"; 
        
        let map;
        let originMarker;
        let destinationMarker;
        let routeLine;
        let selectedDestinationCoords = null;
        let lastTripData = null; 
        let tileLayer; 
        let isEditMode = false; // Modo edición de ORIGEN
        let isPinMode = false; // Modo Pin de DESTINO
        
        // Icono para el origen editable
        const redIcon = new L.Icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        // Icono para el destino manual (rojo, igual que el origen en modo edición)
        const destinationManualIcon = redIcon;
        
        // Icono para el destino automático (azul)
        const destinationAutoIcon = new L.Icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });


        // Firebase Vars
        let app;
        let db;
        let auth;
        let userId = null;
        let isAuthReady = false;

        // --- Referencias DOM ---
        const htmlElement = document.documentElement;
        const themeToggleBtn = document.getElementById('theme-toggle');
        const destinoInput = document.getElementById('destino');
        const suggestionsDestino = document.getElementById('suggestions-destino');
        const searchSpinner = document.getElementById('search-spinner');
        const resultsArea = document.getElementById('results-area');
        const distanceResult = document.getElementById('distance-result');
        const totalCostElement = document.getElementById('total-cost');
        const tarifaBaseInput = document.getElementById('tarifa-base');
        const costoKmInput = document.getElementById('costo-km');
        const tipoPedidoSelect = document.getElementById('tipo-pedido'); 
        const messageArea = document.getElementById('message-area');
        const saveTripBtn = document.getElementById('save-trip-btn');
        const tripHistoryContainer = document.getElementById('trip-history-container');
        const userIdDisplay = document.getElementById('user-id-display');
        const tripCount = document.getElementById('trip-count');
        const printHistoryBtn = document.getElementById('print-history-btn');
        const printView = document.getElementById('print-view');
        
        // Origen DOM
        const editOriginBtn = document.getElementById('edit-origin-btn');
        const originNameDisplay = document.getElementById('origin-name-display');
        const editModeMessage = document.getElementById('edit-mode-message');
        
        // Destino DOM (Nuevos elementos)
        const pinModeMessage = document.getElementById('pin-mode-message');
        const crosshair = document.getElementById('crosshair');
        const pinDestinationBtn = document.getElementById('pin-destination-btn');
        const destinoInputWrapper = document.getElementById('destino-input-wrapper');


        // --- FUNCIONES DE TEMA OSCURO/CLARO (Inalteradas) ---

        function applyTheme(theme) {
            if (theme === 'dark') {
                htmlElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                themeToggleBtn.innerHTML = '🌙'; 
                updateMapTheme('dark');
            } else {
                htmlElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                themeToggleBtn.innerHTML = '🌞'; 
                updateMapTheme('light');
            }
        }

        window.toggleTheme = function() {
            const currentTheme = localStorage.getItem('theme') || 'light';
            applyTheme(currentTheme === 'light' ? 'dark' : 'light');
        }

        function initTheme() {
            const storedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            if (storedTheme) {
                applyTheme(storedTheme);
            } else if (prefersDark) {
                applyTheme('dark');
            } else {
                applyTheme('light');
            }
        }
        
        // Cambia la capa de mapa de Leaflet según el tema
        function updateMapTheme(theme) {
            if (!map) return; 

            if (tileLayer) {
                map.removeLayer(tileLayer);
            }

            let tileUrl;
            let attribution;

            if (theme === 'dark') {
                // CartoDB Dark Matter para modo oscuro
                tileUrl = 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png';
                attribution = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>';
            } else {
                // OpenStreetMap estándar para modo claro
                tileUrl = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
                attribution = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';
            }

            tileLayer = L.tileLayer(tileUrl, {
                attribution: attribution,
                maxZoom: 19
            }).addTo(map);

            map.setView(ORIGIN_COORDS, 15);
            if (originMarker) {
                 originMarker.openPopup();
            }

            // Cambiar el color de la ruta para el contraste
            if (routeLine) {
                routeLine.setStyle({
                    color: theme === 'dark' ? '#14B8A6' : '#0D9488'
                });
            }
        }


        // --- FUNCIONES DE FIREBASE (Inalteradas) ---

        async function initializeFirebase() {
            try {
                // 1. Inicializar App
                const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                // 2. Autenticación
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                
                // 3. Listener de Estado de Autenticación
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        userId = user.uid;
                        userIdDisplay.textContent = userId;
                        isAuthReady = true;
                        loadTripsListener();
                        loadOriginLocation(); // Cargar la ubicación del origen guardada por el usuario
                    } else {
                        userId = 'No autenticado';
                        userIdDisplay.textContent = 'No autenticado (Temporal)';
                        isAuthReady = true;
                        loadOriginLocation(); // Cargar la ubicación por defecto o la última guardada en localStorage si no hay auth
                    }
                });
            } catch (error) {
                console.error("Error al inicializar Firebase o autenticar:", error);
                messageArea.textContent = "Error de conexión a la base de datos.";
            }
        }
        
        // --- Gestión de Ubicación del Origen ---
        
        // Cargar las coordenadas de origen guardadas (si existen)
        function loadOriginLocation() {
            const savedOrigin = localStorage.getItem('user_origin_coords');
            if (savedOrigin) {
                try {
                    const coords = JSON.parse(savedOrigin);
                    ORIGIN_COORDS = [coords.lat, coords.lng];
                    ORIGIN_NAME = coords.name || ORIGIN_NAME;
                    SHORT_ORIGIN_NAME = coords.shortName || SHORT_ORIGIN_NAME;
                    originNameDisplay.textContent = `${SHORT_ORIGIN_NAME}`;

                    // Refrescar el mapa con el nuevo origen
                    if (map) {
                        map.setView(ORIGIN_COORDS, 15);
                        updateOriginMarker();
                    }
                } catch (e) {
                    console.error("Error al parsear coordenadas de origen guardadas:", e);
                    // Usar valores por defecto si falla la carga
                }
            } else {
                 updateOriginMarker(); // Crear el marcador inicial con los valores por defecto
            }
        }
        
        // Actualiza la posición y el icono del marcador de origen
        function updateOriginMarker() {
            if (originMarker) map.removeLayer(originMarker);

            // Determinar qué icono usar
            // El origen usa el icono azul por defecto, y el rojo si está en modo edición
            const markerIcon = isEditMode ? redIcon : destinationAutoIcon; 

            originMarker = L.marker(ORIGIN_COORDS, { icon: markerIcon }).addTo(map);
            originMarker.bindPopup(`<b>${SHORT_ORIGIN_NAME}</b><br>Punto de Salida`).openPopup();
        }

            editOriginBtn.classList.toggle('btn-secondary', !isEditMode);
            editOriginBtn.classList.toggle('btn-edit-active', isEditMode);

            // 2. Mostrar/Ocultar mensaje de modo edición
            document.body.classList.toggle('edit-active', isEditMode);

        // Manejar click en el mapa en modo edición (ORIGEN)
        function handleOriginEditClick(e) {

            const newLat = e.latlng.lat;

                    // 5. Si había un destino, recalcular la ruta con el nuevo origen

                    }
                })

                    console.error("Error en geocodificación inversa:", error);
                    SHORT_ORIGIN_NAME = `Lat: ${newLat.toFixed(4)}, Lon: ${newLng.toFixed(4)}`;
                    ORIGIN_NAME = SHORT_ORIGIN_NAME;
                    originNameDisplay.textContent = SHORT_ORIGIN_NAME;
                    localStorage.setItem('user_origin_coords', JSON.stringify({ 
                        lat: newLat, 
                        lng: newLng, 
                        name: ORIGIN_NAME,
                        shortName: SHORT_ORIGIN_NAME
                    }));

                    toggleEditMode();

        // Manejar click en el mapa en modo Pin (DESTINO)
        function handleDestinationPinClick(e) {

                    showMessage("Destino fijado manualmente (coordenadas).", "warning");
                });

        // Geocodificación Inversa (lat/lng a dirección)
        async function reverseGeocode(lat, lon) {
            const params = new URLSearchParams({
                lat: lat,
                lon: lon,
                format: 'json',
                addressdetails: 1
            });
            const url = `https://nominatim.openstreetmap.org/reverse?${params.toString()}`;
            
            const response = await fetch(url);
            if (!response.ok) throw new Error('Error en la geocodificación inversa');
            const data = await response.json();

            let shortName = data.display_name.split(',').slice(0, 2).join(', ').trim();
            if (data.address && data.address.road) {
                 shortName = data.address.road;
                 if (data.address.house_number) {
                     shortName += ` ${data.address.house_number}`;
                 }
            }
            
            return {
                full: data.display_name,
                short: shortName
            };
        }
        
        // --- Operaciones de Firestore (Inalteradas) ---

            }

            const buttonTextOriginal = saveTripBtn.textContent;

            const tipoPedido = tipoPedidoSelect.value;

                originCoords: ORIGIN_COORDS, // Guardar las coordenadas del origen actual
                tipoDePedido: tipoPedido,
                timestamp: serverTimestamp() 
            };
            
            try {
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        function loadTripsListener() {
            if (!isAuthReady || !userId) return;

            const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
            const collectionPath = `artifacts/${appId}/users/${userId}/saved_trips`;
            const q = query(collection(db, collectionPath));
            
            onSnapshot(q, (snapshot) => {
                const trips = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.timestamp && typeof data.timestamp.toDate === 'function') {
                        data.date = data.timestamp.toDate().toLocaleString('es-AR');
                    } else {
                        data.date = 'Fecha pendiente';
                    }
                    trips.push({ id: doc.id, ...data });
                });
                
                // Ordenar por fecha (descendente)
                trips.sort((a, b) => {
                    if (a.timestamp && b.timestamp) {
                        return b.timestamp.toMillis() - a.timestamp.toMillis();
                    }
                    return 0;
                });
                
                renderHistory(trips);
            }, (error) => {
                console.error("Error al escuchar el historial:", error);
                tripHistoryContainer.innerHTML = '<p class="text-center text-accent-error text-sm">Error al cargar el historial.</p>';
            });
        }
        
        function renderHistory(trips) {
            tripHistoryContainer.innerHTML = '';
            tripCount.textContent = trips.length;

            if (trips.length === 0) {
                tripHistoryContainer.innerHTML = '<p class="text-center text-gray-500 dark:text-gray-400 text-sm">Aún no has guardado ningún viaje.</p>';
                printHistoryBtn.disabled = true;
                return;
            }

            printHistoryBtn.disabled = false;

            trips.forEach(trip => {
                const div = document.createElement('div');
                div.className = 'p-3 rounded-xl border flex justify-between items-center bg-gray-100 border-gray-200 dark:bg-gray-600 dark:border-gray-500';
                
                const distanceStr = trip.distanceKm ? `${trip.distanceKm.toFixed(2)} km` : 'N/A';
                const costStr = trip.totalCost ? `$${trip.totalCost.toLocaleString('es-AR')}` : '$0';
                const tipoPedido = trip.tipoDePedido || 'N/A';
                const originDisp = trip.originName ? (trip.originName.split(',')[0].trim() || 'Origen') : 'Origen';
                
                // Determinar el color según el tipo de pago
                let tipoColor = 'text-gray-600 dark:text-gray-300'; 
                if (tipoPedido.includes('Contado')) {
                    tipoColor = 'text-green-600 dark:text-green-400';
                } else if (tipoPedido.includes('Débito')) {
                    tipoColor = 'text-blue-600 dark:text-blue-400';
                } else if (tipoPedido.includes('Crédito')) {
                    tipoColor = 'text-indigo-600 dark:text-indigo-400';
                }

                div.innerHTML = `
                    <div class="flex flex-col flex-grow truncate">
                        <span class="text-sm font-semibold text-primary-dark truncate">${trip.destinationName || 'Destino Desconocido'}</span>
                        <div class="flex items-center space-x-2">
                           <span class="text-xs text-gray-500 dark:text-gray-400">Origen: ${originDisp}</span>
                           <span class="text-xs font-bold ${tipoColor}">(${tipoPedido})</span>
                        </div>
                        <span class="text-xs text-gray-500 dark:text-gray-400 mt-1">${trip.date}</span>
                    </div>
                    <div class="text-right ml-4 flex-shrink-0">
                        <span class="text-md font-bold text-gray-800 dark:text-gray-100 block">${costoStr}</span>
                        <span class="text-xs text-gray-500 dark:text-gray-400">${distanceStr}</span>
                    </div>
                `;
                tripHistoryContainer.appendChild(div);
            });
        }

        // --- Lógica de Búsqueda (Nominatim API) ---
        let debounceTimer;

        destinoInput.addEventListener('input', (e) => {
            if (isPinMode) return; // Ignorar input si está en modo Pin
            
            const query = e.target.value.trim();
            clearTimeout(debounceTimer);

            if (query.length < 3) {
                suggestionsDestino.classList.add('hidden');
                return;
            }

            searchSpinner.classList.remove('hidden');

            debounceTimer = setTimeout(() => {
                fetchAddresses(query);
            }, 500); 
        });

        async function fetchAddresses(query) {
            try {
                // Forzar la búsqueda en Paraná para mantener la relevancia
                const searchQuery = `${query}, Paraná, Entre Rios`; 
                const params = new URLSearchParams({
                    q: searchQuery,
                    format: 'json',
                    addressdetails: 1,
                    limit: 8,
                    countrycodes: 'ar'
                });

                // Nominatim es el servicio de geocodificación de OpenStreetMap
                const url = `https://nominatim.openstreetmap.org/search?${params.toString()}`;
                
                const response = await fetch(url);
                if (!response.ok) throw new Error('Error en la respuesta de la red');
                const data = await response.json();

                renderSuggestions(data);
            } catch (error) {
                console.error("Error buscando direcciones:", error);
                searchSpinner.classList.add('hidden');
                suggestionsDestino.classList.add('hidden');
            } finally {
                searchSpinner.classList.add('hidden');
            }
        }

        function renderSuggestions(results) {
            suggestionsDestino.innerHTML = '';
            
            if (!results || !Array.isArray(results) || results.length === 0) {
                suggestionsDestino.innerHTML = '<div class="p-3 text-xs text-gray-500 dark:text-gray-400 text-center">No se encontraron resultados.</div>';
                suggestionsDestino.classList.remove('hidden');
                return;
            }

            results.forEach(place => {
                const addr = place.address || {};
                let mainText = '';
                
                // Priorizar Calle y Altura, si existen
                if (addr.road) {
                    mainText = addr.road;
                    if (addr.house_number) {
                        mainText += ` ${addr.house_number}`;
                    }
                } else {
                    mainText = place.display_name.split(',')[0]; 
                }

                // Generar Subtexto
                let subTextParts = [];
                if (addr.neighbourhood) subTextParts.push(addr.neighbourhood);
                if (addr.suburb) subTextParts.push(addr.suburb);
                if (addr.city === 'Paraná') subTextParts.push('Paraná'); 
                else if (!addr.neighbourhood && !addr.suburb) subTextParts.push('Entre Ríos'); 

                const uniqueSubTextParts = [...new Set(subTextParts)].join(', ');
                const subText = uniqueSubTextParts || 'Entre Ríos';


                const div = document.createElement('div');
                div.className = 'suggestion-item'; 
                div.innerHTML = `
                    <svg class="w-4 h-4 mr-2 text-gray-400 flex-shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    <div class="flex flex-col overflow-hidden">
                        <span class="truncate text-sm font-medium text-gray-700 dark:text-gray-200">${mainText}</span>
                        <span class="truncate text-xs text-gray-400">${subText}</span>
                    </div>
                `;
                
                div.addEventListener('click', () => {
                    selectDestination(place, mainText); 
                });

                suggestionsDestino.appendChild(div);
            });

            suggestionsDestino.classList.remove('hidden');
        }

        function selectDestination(place, displayName) {
            destinoInput.value = displayName;
            suggestionsDestino.classList.add('hidden');
            
            const lat = parseFloat(place.lat);
            const lon = parseFloat(place.lon);
            selectedDestinationCoords = [lat, lon];

            // false para marcador automático
            updateMapAndCalculate(lat, lon, displayName, false); 
        }

        // --- Cálculos y Actualización del Mapa (Leaflet) ---

        function updateMapAndCalculate(destLat, destLon, destinationName, isManualPin = false) {
            // 1. Limpiar mapa anterior
            if (destinationMarker) map.removeLayer(destinationMarker);
            if (routeLine) map.removeLayer(routeLine);

            // 2. Añadir marcador de destino (manual=rojo, automático=azul)
            const iconToUse = isManualPin ? destinationManualIcon : destinationAutoIcon;
            destinationMarker = L.marker([destLat, destLon], { icon: iconToUse }).addTo(map);
            destinationMarker.bindPopup(destinationName || "Destino").openPopup();

            // 3. Dibujar línea. 
            const latlngs = [ORIGIN_COORDS, [destLat, destLon]];
            const routeColor = htmlElement.classList.contains('dark') ? '#14B8A6' : '#0D9488';
            routeLine = L.polyline(latlngs, {color: routeColor, weight: 4, opacity: 0.8, dashArray: '10, 10'}).addTo(map);

            // 4. Ajustar vista para incluir Origen y Destino
            map.fitBounds(L.latLngBounds(latlngs), {padding: [50, 50]});

            // 5. Calcular Distancia (Fórmula de Haversine)
            const distKm = calculateDistance(ORIGIN_COORDS[0], ORIGIN_COORDS[1], destLat, destLon);
            
            // 6. Calcular Costo
            const base = parseFloat(tarifaBaseInput.value) || 0;
            const kmPrice = parseFloat(costoKmInput.value) || 0;
            const total = Math.ceil(base + (distKm * kmPrice));

            // 7. Almacenar datos para guardar
            lastTripData = {
                destinationName: destinationName || 'Destino manual',
                destinationCoords: [destLat, destLon],
                distanceKm: distKm,
                totalCost: total,
                isManual: isManualPin // Agregar información de si fue manual
            };

            // 8. Mostrar Resultados
            distanceResult.textContent = distKm.toFixed(2) + " km";
            totalCostElement.textContent = "$" + total.toLocaleString('es-AR');
            
            // 9. Habilitar visualmente y el botón de guardar
            resultsArea.classList.remove('opacity-50', 'pointer-events-none');
            // Restablecer el botón al estado de 'Guardar Viaje'
            saveTripBtn.textContent = "Guardar Viaje"; 
            saveTripBtn.classList.remove('bg-accent-success', 'hover:bg-green-500', 'text-white');
            saveTripBtn.classList.add('btn-primary');
            saveTripBtn.disabled = false;
            
            showMessage("Ruta calculada con éxito. ¡Ya puedes guardar el viaje!", "success");
        }

        // Fórmula para calcular la distancia entre dos coordenadas (Haversine)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Radio de la tierra en km
            const dLat = deg2rad(lat2 - lat1);
            const dLon = deg2rad(lon2 - lon1);
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * Math.sin(dLon/2) * Math.sin(dLon/2); 
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
            return R * c;
        }

        function deg2rad(deg) {
            return deg * (Math.PI/180);
        }

        // --- Utilidades ---
        function showMessage(msg, type) {
            messageArea.textContent = msg;
            let bgColor = 'text-primary-dark';
            if (type === 'error') bgColor = 'text-accent-error';
            if (type === 'warning') bgColor = 'text-accent-warning';
            messageArea.className = `mt-4 h-5 text-xs text-center font-medium ${bgColor}`;
            setTimeout(() => { messageArea.textContent = ''; }, 3000);
        }

        window.toggleSettings = function() {
            const panel = document.getElementById('settings-panel');
            panel.classList.toggle('hidden');
            panel.classList.toggle('flex');
        }

        // Listener para recalcular si cambian las tarifas o el tipo de pedido
        const inputsAndSelects = [tarifaBaseInput, costoKmInput, tipoPedidoSelect];
        if (tarifaBaseInput && costoKmInput && tipoPedidoSelect) {
            inputsAndSelects.forEach(element => {
                element.addEventListener('change', () => {
                    if (selectedDestinationCoords) {
                        updateMapAndCalculate(selectedDestinationCoords[0], selectedDestinationCoords[1], destinoInput.value);
                    }
                });
            });
        }


        // Ocultar sugerencias al hacer click fuera
        document.addEventListener('click', (e) => {
            if (destinoInput && suggestionsDestino && !destinoInputWrapper.contains(e.target) && !suggestionsDestino.contains(e.target)) {
                suggestionsDestino.classList.add('hidden');
            }
        });
        
        // --- Listener de escape para ambos modos ---
        document.addEventListener('keydown', (e) => {
            if (e.key === "Escape") {
                if (isEditMode) toggleEditMode();
                if (isPinMode) togglePinMode();
            }
        });


        // --- Inicialización del Mapa ---
        function initMap() {
            // Inicializar el mapa de Leaflet
            map = L.map('map', { zoomControl: false }).setView(ORIGIN_COORDS, 15);
            
            // Listener para el modo edición de ORIGEN
            map.on('click', handleOriginEditClick);
            
            // Listener para el modo PIN de DESTINO
            map.on('click', handleDestinationPinClick);

            // La capa y el marcador de origen se establecen en initTheme y loadOriginLocation
        }


        // Iniciar
        window.onload = () => {
            initMap();
            initTheme(); // Inicializar tema y capa de mapa Leaflet (que también ajusta la vista)
            initializeFirebase(); // Inicializar Firebase después del mapa
        };

    </script>
</body>
